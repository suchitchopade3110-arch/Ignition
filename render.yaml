# Render Blueprint — see docs/DEPLOY_RENDER.md for the full walkthrough
# (provisioning the GitHub App, Supabase, filling in the secret env vars
# below, and what to fix if your service names collide with someone
# else's and Render suffixes your onrender.com hostnames).
#
# Topology (solutions doc, "Infrastructure and operations"; I-3): one
# Render service per process, so each process is PID 1 and gets SIGTERM
# on deploys, and only the frontend and backend face the internet.
#
#   ignition-frontend  web       next start; the only origin the browser
#                                talks to: it rewrites /api and /auth to
#                                the backend (audit P0-5)
#   ignition-backend   web       uvicorn only
#   ignition-worker    worker    arq: runs reviews, the embedder
#   ignition-analyzer  pserv     Bun + ts-morph, private network only; the
#                                only service that handles customer code
#   ignition-redis     keyvalue  Arq queue, SSE, token cache, rate limits
#
# Plan names follow the solutions doc's table; Render validates them when
# the blueprint syncs (HUMAN_ACTIONS has the check).

services:
  - type: keyvalue
    name: ignition-redis
    plan: starter
    ipAllowList: [] # internal only — nothing outside this Render account needs to reach it
    maxmemoryPolicy: noeviction # Arq's job queue needs entries to persist, not get evicted under memory pressure

  - type: pserv
    name: ignition-analyzer
    runtime: docker
    dockerfilePath: ./ast-analyzer/Dockerfile
    dockerContext: ./ast-analyzer
    plan: 1c-2g
    envVars:
      # A private service is reachable only on Render's private network,
      # so it must listen on all interfaces there (server.ts defaults to
      # loopback).
      - key: AST_ANALYZER_HOST
        value: "0.0.0.0"
      # Shared bare mirrors plus one worktree per review (audit P0-3).
      - key: AST_WORKSPACES_ROOT
        value: /srv/workspaces
      - key: AST_CACHE_MAX_PROJECTS
        value: "25"

  - type: web
    name: ignition-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    plan: 0.5c-512mb
    # Dependency-free liveness (I-5); the deep check is /readyz.
    healthCheckPath: /livez
    envVars:
      - key: APP_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ignition-redis
          property: connectionString
      # The analyzer's private host:port (no scheme; ASTClient adds http://).
      - key: AST_SERVICE_URL
        fromService:
          type: pserv
          name: ignition-analyzer
          property: hostport
      - key: METRICS_ENABLED
        value: "true"
      # Bearer token for GET /readyz (I-5). Any long random string.
      - key: READYZ_TOKEN
        sync: false
      # Same-origin topology (audit P0-5): the browser reaches this service
      # only through the frontend's /api and /auth rewrites, so cookies are
      # first-party and Lax is correct again.
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      # The PUBLIC origin of this API — the frontend, which proxies it. The
      # OAuth redirect_uri is built from this, so GitHub sends the user back
      # through the frontend and the session cookie is set there.
      # BACKEND_BASE_URL, FRONTEND_BASE_URL and ALLOWED_ORIGINS all need
      # the real onrender.com hostnames Render assigns on first deploy —
      # see docs/DEPLOY_RENDER.md step 3. Placeholders below assume
      # `ignition-backend`/`ignition-frontend` weren't already taken.
      - key: BACKEND_BASE_URL
        value: https://ignition-frontend.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://ignition-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://ignition-frontend.onrender.com
      # Rate limits live in the same Redis, so they survive a redeploy and
      # are already correct if this ever scales past one instance.
      - key: RATE_LIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: ignition-redis
          property: connectionString
      # --- Secrets: fill these in via the Render dashboard after the
      # first blueprint sync (sync: false means Render won't manage or
      # overwrite them). See docs/DEPLOY_RENDER.md for where each comes
      # from.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Fernet key(s) encrypting users' GitHub tokens at rest (audit P1-1).
      - key: SESSION_TOKEN_KEYS
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      # openai/gpt-oss-120b (qwen/qwen3-32b was shut down by Groq).
      - key: LLM_MODEL_NAME
        sync: false
      # gpt-oss takes low|medium|high (never "none"); set low. Blank omits it.
      - key: LLM_REASONING_EFFORT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  - type: worker
    name: ignition-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: arq app.worker.WorkerSettings
    plan: 1c-2g
    # Arq drains in-flight jobs for job_completion_wait (50 s, app/worker.py)
    # after SIGTERM; Render waits this long before SIGKILL (default 30).
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ignition-redis
          property: connectionString
      - key: AST_SERVICE_URL
        fromService:
          type: pserv
          name: ignition-analyzer
          property: hostport
      # Check-run details links point at the dashboard (audit P0-6).
      - key: FRONTEND_BASE_URL
        value: https://ignition-frontend.onrender.com
      # --- Secrets (same values as on ignition-backend) ---
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        sync: false
      - key: LLM_REASONING_EFFORT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  - type: web
    name: ignition-frontend
    runtime: node
    rootDir: frontend
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    # next start binds process.env.PORT itself — Render sets PORT, no
    # -p flag needed.
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # NEXT_PUBLIC_* vars are inlined at build time, not read at runtime
      # — changing this after the first deploy needs a rebuild (Manual
      # Deploy > Clear build cache & deploy), not just a restart.
      # Same-origin (audit P0-5): the API is this app's own /api path.
      - key: NEXT_PUBLIC_API_URL
        value: /api
      # Empty = same origin: the login link is /auth/github/login here.
      - key: NEXT_PUBLIC_BACKEND_URL
        value: ""
      # Where next.config.ts's rewrites proxy /api and /auth. Read at build
      # time; same collision caveat as BACKEND_BASE_URL above.
      - key: BACKEND_INTERNAL_URL
        value: https://ignition-backend.onrender.com
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
