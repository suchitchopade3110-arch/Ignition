name: CI

# Runs the full tests/ suite on every PR and push to main, and fails the
# build on any test failure — including tests/test_agent_1_gate.py
# (Hard-Rule gate), tests/test_routing.py (agent routing/forking), and
# tests/test_scoring.py (severity/ACS scoring), which are unconditionally
# collected as part of `pytest tests/` below, not opted into separately.
#
# No repo secrets are configured or required. Every external dependency
# the test suite would otherwise hit for real (GitHub, Groq, Supabase, the
# Bun AST analyzer, the embedding model) is mocked — see
# tests/conftest.py and tests/test_integration_webhook_review_comment.py's
# module docstring for the mocking approach and why. The dummy env values
# below exist only so app/config.py's Settings can construct without
# raising at import time; nothing in the suite performs a real network
# call using them.
#
# The `frontend` job runs the Next.js dashboard's own lint (eslint),
# typecheck (tsc --noEmit), and unit tests (vitest, frontend/tests/*) —
# previously not wired into CI at all despite existing in the repo, so a
# broken build/type error/failing test there was invisible until deploy.
#
# The `ast-analyzer` job runs the Bun service's own unit tests (bun test,
# ast-analyzer/analyzer.test.ts — the LRU project-cache eviction logic).
#
# The `docker-build` job builds both Dockerfiles (the combined
# backend+worker image, and the AST analyzer's own image) — previously
# nothing in CI verified either image actually builds; a broken Dockerfile
# was only discoverable at deploy time. Build-only, no push: no registry
# credentials are configured here (this repo has none), and catching a
# broken build doesn't require one.
#
# The `dependency-audit` job scans every dependency tree for known CVEs —
# previously nothing did this at all (Dependabot, added alongside this
# workflow in .github/dependabot.yml, opens update PRs but doesn't gate
# CI). `pip-audit` against requirements.txt is blocking: the backend tree
# is clean today, and a hashed/pinned lockfile means a new finding only
# shows up when something actually changes, so there's no noise to
# tolerate. `npm audit` and `bun audit` run informational-only
# (continue-on-error) for now — both frontend and ast-analyzer currently
# carry pre-existing high-severity advisories in transitive deps (next,
# postcss, sharp, js-yaml, fast-uri, brace-expansion) that need triage
# before this can block merges without immediately going red; the job
# still surfaces them in every run's logs so they can't go unnoticed.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_APP_ID: "12345"
      GITHUB_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nDUMMY\n-----END RSA PRIVATE KEY-----"
      GITHUB_WEBHOOK_SECRET: "test-webhook-secret"
      GITHUB_CLIENT_ID: "dummy-client-id"
      GITHUB_CLIENT_SECRET: "dummy-client-secret"
      LLM_PROVIDER: "groq"
      LLM_API_KEY: "dummy-llm-key"
      LLM_MODEL_NAME: "dummy-model"
      SUPABASE_URL: "https://dummy-project.supabase.co"
      SUPABASE_SERVICE_KEY: "dummy-service-key"
      AST_SERVICE_URL: "http://localhost:4000"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs from the fully pinned, hashed requirements.txt (not
      # requirements.in) — reproducible dependency tree, same one a fresh
      # `pip install -r requirements.txt` produces locally.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  ast-analyzer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ast-analyzer
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false

      - name: Build AST analyzer image
        uses: docker/build-push-action@v7
        with:
          context: ./ast-analyzer
          push: false

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend, blocking)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend, informational)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun audit (ast-analyzer, informational)
        working-directory: ast-analyzer
        continue-on-error: true
        run: bun audit
